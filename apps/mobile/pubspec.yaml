name: mobile
description: >-
  Prism mobile — Flutter app targeting Android and Linux desktop. Depends
  on `prism_core` (scanner + models) and `prism_playback` (just_audio +
  queue wrappers). Part of the Prism workspace; resolution is handled by
  the root `pubspec.yaml`.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Prism workspace packages
  prism_core: any
  prism_playback: any

  # Direct runtime deps (tight surface for slice 1)
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  flutter_riverpod: ^3.0.1
  path_provider: ^2.1.5
  audio_metadata_reader: ^1.4.2
  cupertino_icons: ^1.0.8
  # Android 13+ (API 33) made POST_NOTIFICATIONS a runtime permission.
  # `audio_service` does not ship a requester of its own, so we use
  # `permission_handler` to prompt on first launch. Slice 1 accepts
  # one first-launch verification miss if the user denies — playback
  # still works, only the lockscreen transport goes dark.
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
